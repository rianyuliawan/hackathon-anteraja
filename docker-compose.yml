services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: satria
      POSTGRES_USER: satria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satria_local}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - satria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satria -d satria"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  satria_pgdata:
